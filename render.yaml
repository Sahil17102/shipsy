services:
  - type: web
    name: shipsy-client
    runtime: static
    rootDir: client-panel
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: shipsy-courier-api
    runtime: node
    rootDir: client-panel
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: shipsy-provider-orders
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: TEAMPAFEX_EMAIL
        sync: false
      - key: TEAMPAFEX_PASSWORD
        sync: false
      - key: FSHIP_API_URL
        value: https://api.logixmitra.com/api
      - key: FSHIP_API_EMAIL
        sync: false
      - key: FSHIP_API_PASSWORD
        sync: false
      - key: DELHIVERY_TOKEN
        sync: false
      - key: DELHIVERY_PICKUP_NAME
        value: BILAL
  - type: web
    name: shipsy-1admin
    runtime: static
    rootDir: admin-panel
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
